<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Basis · Logo exploration</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    html, body { margin: 0; background: #f0eee9; }
    .card-dark  { background: #111827; color: #eef1f8; }
    .card-light { background: #f6f4ef; color: #0b1220; }
    .card-amber { background: #f59e0b; color: #0b1220; }
    .f-serif { font-family: "Fraunces", Georgia, serif; }
    .f-sans  { font-family: "Inter", system-ui, sans-serif; }
    .f-mono  { font-family: "JetBrains Mono", ui-monospace, monospace; }
    .eyebrow { font-family: "JetBrains Mono", monospace; font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; opacity: 0.55; }
    .hr-dark  { height: 1px; background: rgba(255,255,255,0.08); border: 0; }
    .hr-light { height: 1px; background: rgba(0,0,0,0.08); border: 0; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="design-canvas.jsx"></script>
  <script type="text/babel" src="logos.jsx"></script>

  <script type="text/babel">
    // Each logo concept — rendered across three artboards:
    //   1. Mark, big, on dark navy (primary use)
    //   2. Full lockup (mark + wordmark + tagline)
    //   3. Favicon / avatar grid (16, 32, 64, 512 amber tile)

    const CONCEPTS = [
      { id: 'gap',        Mark: LogoGap,        name: 'Gap',              tagline: 'The space between benchmark and actual.' },
      { id: 'tick',       Mark: LogoTick,       name: 'Basis Tick',       tagline: 'One tick on the benchmark line.' },
      { id: 'stack',      Mark: LogoStack,      name: 'Residual Stack',   tagline: 'Variance, decomposed. Residual on top.' },
      { id: 'beta',       Mark: LogoBeta,       name: 'Beta',             tagline: 'The coefficient that isn\u2019t residual.' },
      { id: 'box',        Mark: LogoBox,        name: 'Dispersion',       tagline: 'Where the median falls inside the range.' },
      { id: 'b',          Mark: LogoB,          name: 'Structural B',     tagline: 'A letter built like a decomposition.' },
      { id: 'delta',      Mark: LogoDelta,      name: 'Delta',            tagline: 'Change, gap, mismatch.' },
      { id: 'futures',    Mark: LogoFutures,    name: 'Futures',          tagline: 'Two candles. The gap between them is the basis.' },
      { id: 'crosshair',  Mark: LogoCrosshair,  name: 'Crosshair',        tagline: 'The miss is the basis.' },
      { id: 'hedge',      Mark: LogoHedge,      name: 'Hedge',            tagline: 'Two curves that should overlap but don\u2019t.' },
      { id: 'notch',      Mark: LogoNotch,      name: 'Notch',            tagline: 'An editorial b, cut by the residual.' },
      { id: 'cup',        Mark: LogoCup,        name: 'Open Bracket',     tagline: 'A decomposition begun. Minimal.' },
    ];

    // Artboard 1 — hero mark card (dark)
    function HeroMark({ Mark, name }) {
      return (
        <div className="card-dark" style={{ width: '100%', height: '100%', padding: 40, display: 'flex', flexDirection: 'column', justifyContent: 'space-between' }}>
          <div className="eyebrow" style={{ color: '#aab4c8' }}>Mark · primary</div>
          <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', flex: 1 }}>
            <Mark size={220} />
          </div>
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline' }}>
            <span className="f-serif" style={{ fontSize: 22, letterSpacing: '-0.01em' }}>{name}</span>
            <span className="eyebrow" style={{ color: '#aab4c8' }}>on #111827</span>
          </div>
        </div>
      );
    }

    // Artboard 2 — full lockup + tagline (editorial composition)
    function Lockup({ Mark, name, tagline }) {
      return (
        <div className="card-dark" style={{ width: '100%', height: '100%', padding: 40, display: 'flex', flexDirection: 'column' }}>
          <div className="eyebrow" style={{ color: '#aab4c8', marginBottom: 'auto' }}>Lockup</div>

          {/* horizontal lockup */}
          <div style={{ display: 'flex', alignItems: 'center', gap: 18, marginBottom: 48 }}>
            <Mark size={56} />
            <div style={{ width: 1, height: 36, background: 'rgba(255,255,255,0.2)' }} />
            <div>
              <div className="f-serif" style={{ fontSize: 34, letterSpacing: '-0.02em', lineHeight: 1, color: '#fff' }}>Basis</div>
              <div className="f-mono" style={{ fontSize: 9, letterSpacing: '0.16em', color: '#aab4c8', textTransform: 'uppercase', marginTop: 5 }}>gpu · compute · fungibility</div>
            </div>
          </div>

          <hr className="hr-dark" style={{ margin: '0 0 22px' }} />

          {/* vertical / stacked lockup */}
          <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'flex-start', gap: 14, marginBottom: 28 }}>
            <Mark size={40} />
            <div className="f-serif" style={{ fontSize: 26, letterSpacing: '-0.02em', lineHeight: 1, color: '#fff' }}>Basis</div>
          </div>

          <hr className="hr-dark" style={{ margin: '0 0 16px' }} />

          <p className="f-serif" style={{ fontSize: 14, fontStyle: 'italic', color: '#aab4c8', margin: 0, lineHeight: 1.5 }}>
            &ldquo;{tagline}&rdquo;
          </p>
        </div>
      );
    }

    // Artboard 3 — favicon / avatar set
    function Favicons({ Mark, name }) {
      return (
        <div className="card-light" style={{ width: '100%', height: '100%', padding: 32, display: 'flex', flexDirection: 'column' }}>
          <div className="eyebrow" style={{ color: '#4b5671' }}>Favicon · avatar</div>

          <div style={{ marginTop: 28, display: 'grid', gap: 24 }}>
            {/* Row 1 — light mode tiles */}
            <div>
              <div className="f-mono" style={{ fontSize: 10, color: '#6f7b94', letterSpacing: '0.08em', marginBottom: 8 }}>LIGHT · {name}</div>
              <div style={{ display: 'flex', alignItems: 'flex-end', gap: 16 }}>
                {[16, 32, 48, 64].map(s => (
                  <div key={s} style={{ textAlign: 'center' }}>
                    <div style={{ width: s, height: s, background: '#f6f4ef', border: '1px solid rgba(0,0,0,0.08)', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
                      <Mark size={s - 6} ink="#0b1220" />
                    </div>
                    <div className="f-mono" style={{ fontSize: 9, color: '#6f7b94', marginTop: 5 }}>{s}</div>
                  </div>
                ))}
              </div>
            </div>

            {/* Row 2 — dark mode tiles */}
            <div>
              <div className="f-mono" style={{ fontSize: 10, color: '#6f7b94', letterSpacing: '0.08em', marginBottom: 8 }}>DARK</div>
              <div style={{ display: 'flex', alignItems: 'flex-end', gap: 16 }}>
                {[16, 32, 48, 64].map(s => (
                  <div key={s} style={{ width: s, height: s, background: '#111827', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
                    <Mark size={s - 6} />
                  </div>
                ))}
              </div>
            </div>

            {/* Row 3 — amber avatar + social card */}
            <div>
              <div className="f-mono" style={{ fontSize: 10, color: '#6f7b94', letterSpacing: '0.08em', marginBottom: 8 }}>ON AMBER · avatar</div>
              <div style={{ display: 'flex', alignItems: 'flex-end', gap: 16 }}>
                <div className="card-amber" style={{ width: 72, height: 72, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
                  <Mark size={56} ink="#0b1220" amber="#0b1220" />
                </div>
                <div style={{ width: 72, height: 72, borderRadius: 36, background: '#0b1220', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
                  <Mark size={52} />
                </div>
                <div style={{ flex: 1, background: '#0b1220', padding: '14px 16px', display: 'flex', alignItems: 'center', gap: 12 }}>
                  <Mark size={28} />
                  <span className="f-serif" style={{ fontSize: 17, color: '#fff' }}>Basis</span>
                  <span className="f-mono" style={{ fontSize: 9, color: '#aab4c8', letterSpacing: '0.12em', textTransform: 'uppercase', marginLeft: 'auto' }}>research · 2026</span>
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // Also — a wordmark-only section at the top, since wordmark is always needed
    function WordmarkCard({ variant }) {
      const variants = {
        serif: { font: '"Fraunces", Georgia, serif', italic: false, weight: 400, tracking: '-0.02em' },
        italic: { font: '"Fraunces", Georgia, serif', italic: true, weight: 300, tracking: '-0.01em' },
        mono: { font: '"JetBrains Mono", monospace', italic: false, weight: 500, tracking: '0.04em' },
      };
      const v = variants[variant];
      return (
        <div className="card-dark" style={{ width: '100%', height: '100%', padding: 48, display: 'flex', flexDirection: 'column', justifyContent: 'space-between' }}>
          <div className="eyebrow" style={{ color: '#aab4c8' }}>Wordmark · {variant}</div>
          <div style={{ display: 'flex', alignItems: 'baseline', justifyContent: 'center', gap: 0 }}>
            <span style={{
              fontFamily: v.font,
              fontStyle: v.italic ? 'italic' : 'normal',
              fontWeight: v.weight,
              fontSize: 108,
              letterSpacing: v.tracking,
              color: '#fff',
              lineHeight: 1,
            }}>Basis</span>
            {variant === 'mono' && (
              <span style={{
                background: '#f59e0b', color: '#0b1220',
                fontFamily: '"JetBrains Mono", monospace', fontSize: 13,
                padding: '3px 7px', marginLeft: 10, alignSelf: 'flex-start', marginTop: 14,
                letterSpacing: '0.1em', textTransform: 'uppercase', fontWeight: 600,
              }}>residual</span>
            )}
          </div>
          <div className="f-mono" style={{ fontSize: 10, color: '#aab4c8', letterSpacing: '0.14em', textTransform: 'uppercase', textAlign: 'center' }}>
            GPU compute fungibility · 2026
          </div>
        </div>
      );
    }

    function App() {
      return (
        <DesignCanvas>
          <DCSection id="wordmark" title="Wordmark" subtitle="Type-only treatments — always usable alone.">
            <DCArtboard id="ser"  label="Serif · Fraunces"         width={560} height={380}><WordmarkCard variant="serif" /></DCArtboard>
            <DCArtboard id="ital" label="Italic · light"           width={560} height={380}><WordmarkCard variant="italic" /></DCArtboard>
            <DCArtboard id="mono" label="Mono · terminal"          width={560} height={380}><WordmarkCard variant="mono" /></DCArtboard>
          </DCSection>

          {CONCEPTS.map(c => (
            <DCSection key={c.id} id={c.id} title={c.name} subtitle={c.tagline}>
              <DCArtboard id="m"  label="Mark"     width={360} height={380}><HeroMark Mark={c.Mark} name={c.name} /></DCArtboard>
              <DCArtboard id="l"  label="Lockup"   width={440} height={380}><Lockup Mark={c.Mark} name={c.name} tagline={c.tagline} /></DCArtboard>
              <DCArtboard id="f"  label="Favicons" width={520} height={380}><Favicons Mark={c.Mark} name={c.name} /></DCArtboard>
            </DCSection>
          ))}
        </DesignCanvas>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
