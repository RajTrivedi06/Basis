name: Frontend

# No paths filter: the "test" job is a required check on protected main, and a
# paths-filtered required check never reports on (e.g.) docs-only PRs, which
# blocks their merge forever. Running on every PR is cheap (~1 min).
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npm run lint
      - working-directory: frontend
        run: npx tsc --noEmit
      - working-directory: frontend
        run: npm test
      - working-directory: frontend
        run: npm run build
