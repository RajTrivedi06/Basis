[project]
name = "basis"
version = "0.1.0"
description = "A public-data study quantifying GPU compute fungibility across cloud providers"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "alembic>=1.14.0",
    "asyncpg>=0.30.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "httpx>=0.28.0",
    "playwright>=1.49.0",
    "beautifulsoup4>=4.12.0",
    "boto3>=1.35.0",
    "apscheduler>=3.10.0",
    "pandas==3.0.2",
    "numpy>=2.0.0",
    "python-dotenv>=1.0.0",
    "sentry-sdk[fastapi]>=2.66.1",
    "xgboost==3.2.0",
    "shap==0.51.0",
    "scikit-learn==1.9.0",
    "pgvector>=0.5.0",
    "tiktoken>=0.13.0",
    "openai>=2.51.0",
    "langfuse>=4.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["basis"]

[tool.ruff.lint.per-file-ignores]
"backend/alembic/env.py" = ["I001"]
"backend/alembic/versions/fac2a232ed22_initial_schema.py" = ["I001", "UP007", "UP035", "W291"]
"backend/basis/api/deps.py" = ["F401"]
"backend/basis/api/main.py" = ["I001"]
"backend/basis/api/routes/*.py" = ["B008"]
"backend/basis/api/routes/health.py" = ["I001"]
"backend/basis/collectors/__init__.py" = ["I001", "RUF022"]
"backend/basis/collectors/aws_spot.py" = ["B905", "F401"]
"backend/basis/collectors/base.py" = ["UP017"]
"backend/run_collect.py" = ["F401", "I001"]
"backend/tests/fixtures/capture_fixtures.py" = ["I001"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["boto3.*", "botocore.*", "apscheduler.*", "bs4.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "slow: scans or recomputes against a large database corpus",
]
